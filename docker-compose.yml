services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
  streamlit:
    build: ./streamlit
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      PYTHONUNBUFFERED: "1"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
