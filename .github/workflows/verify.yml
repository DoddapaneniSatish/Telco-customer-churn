name: Verify churn application

on:
  pull_request:
  push:
    branches: [main, fix/churn-portfolio-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serving-and-containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            api/requirements.txt
            streamlit/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify saved model and application integration
        run: |
          python test_inference.py
          python -m pytest tests -q
      - name: Build and start both Docker images
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
      - name: Check container health and real UI-to-API prediction
        run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8501/_stcore/health
          docker compose exec -T streamlit python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('/app/app.py').run(timeout=60)
          assert not app.exception, app.exception
          assert len(app.number_input) + len(app.selectbox) == 19
          app.button[0].click().run(timeout=60)
          assert not app.exception, app.exception
          assert not app.error, app.error
          assert len(app.metric) == 2, app.metric
          assert app.success, 'No successful prediction returned by the API container'
          print('Docker frontend loaded its bundled schema and predicted through the API container.')
          PY
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down
