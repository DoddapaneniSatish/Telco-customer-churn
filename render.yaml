services:
  - type: web
    name: telco-churn-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
  - type: web
    name: telco-churn-streamlit
    runtime: docker
    plan: free
    dockerfilePath: ./streamlit/Dockerfile
    dockerContext: ./streamlit
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: 8501
      - key: API_URL
        sync: false
